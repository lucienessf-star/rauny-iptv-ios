
workflows:
  rauny-iptv-ios:
    name: Rauny IPTV Player - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Instalar dependencias
        script: |
          flutter pub get

          - name: Compilar iOS Release
        script: |
          flutter build ios --release --no-codesign

      - name: Gerar IPA no macOS
        script: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry Rauny-IPTV-Release.ipa Payload

    artifacts:
      - build/ipa/*.ipa
